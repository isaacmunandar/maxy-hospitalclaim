<style>
:root{
  /* MAXY Academy public brand tokens: #0066FF, #FFB800, #0A0A0A. */
  --blue:#0066FF;
  --blue-hover:#0052CC;
  --blue-deep:#00398C;
  --blue-soft:#E8EFFF;
  --blue-pale:#F0F4FF;
  --cyan:#00B4D8;
  --gold:#FFB800;
  --gold-deep:#D99700;
  --gold-soft:#FFF4D2;
  --gold-pale:#FFFBED;
  --white:#FFFFFF;
  --ink:#0A0A0A;
  --text:#202839;
  --muted:#6C757D;
  --soft:#9AA4B2;
  --bg:#F8FBFF;
  --surface:#FFFFFF;
  --line:#E3EAF3;
  --line-strong:#D3DEEB;
  --green:#22A45D;
  --green-soft:#E8F8EF;
  --orange:#FF6905;
  --orange-soft:#FFF0E6;
  --red:#D64545;
  --red-soft:#FFF0F0;
  --violet:#7558D6;
  --violet-soft:#F1EDFF;
  --font:'Poppins','Segoe UI',Arial,sans-serif;
  --display:'Darker Grotesque','Poppins',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --sidebar:258px;
  --header:74px;
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 14px 40px rgba(0,57,140,.07);
  --shadow-sm:0 5px 18px rgba(0,57,140,.055);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:13px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
body.drawer-open,body.modal-open{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue);text-decoration:none}
svg{display:block}
::selection{background:rgba(0,102,255,.16);color:var(--ink)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.mono{font-family:var(--mono);font-size:10.5px;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* app shell */
.app-shell{min-height:100vh}
.sidebar{
  position:fixed;inset:0 auto 0 0;z-index:95;width:var(--sidebar);
  display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--line);
  box-shadow:8px 0 26px rgba(0,57,140,.025);
}
.sidebar-head{
  height:86px;padding:20px 18px 12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;color:var(--ink)}
.brand-mark{
  width:40px;height:40px;border-radius:0;flex:none;display:grid;place-items:center;
  background:none;color:transparent;font-size:0;line-height:1;box-shadow:none;overflow:hidden;
}
.brand-mark svg{width:100%;height:100%;display:block}
.svg-sprite{position:absolute;width:0;height:0;overflow:hidden}
.brand-type{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:5px;min-width:0;line-height:1}
.brand-type b{font-family:var(--display);font-size:25px;letter-spacing:.01em;color:var(--blue);font-weight:900;line-height:1}
.brand-type strong{font-family:var(--display);font-size:21px;color:var(--ink);font-weight:700;line-height:1}
.brand-type small{flex-basis:100%;font-size:7.5px;letter-spacing:.16em;color:var(--soft);font-weight:600;margin-top:3px;white-space:nowrap}
.sidebar-close{display:none;width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:20px;color:var(--muted);line-height:1}
.workspace-switcher{
  margin:4px 14px 12px;border:1px solid var(--line);background:linear-gradient(135deg,#fff,#F8FBFF);
  border-radius:13px;padding:10px;display:grid;grid-template-columns:32px minmax(0,1fr) 14px;align-items:center;gap:9px;
  text-align:left;transition:border-color .16s,box-shadow .16s;
}
.workspace-switcher:hover{border-color:#BFD3F1;box-shadow:var(--shadow-sm)}
.ws-icon{width:32px;height:32px;border-radius:9px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:16px}
.ws-copy{min-width:0}
.ws-copy small{display:block;font-size:7.5px;font-weight:500;color:var(--soft);letter-spacing:.04em;text-transform:uppercase;margin-bottom:1px}
.ws-copy b{display:block;font-size:10.5px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-copy span{display:block;font-size:8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-chevron{font-size:13px;color:var(--soft);text-align:right}
.nav-scroll{flex:1;overflow-y:auto;padding:2px 10px 12px;scrollbar-width:thin;scrollbar-color:#D8E2EF transparent}
.nav-group{margin-bottom:15px}
.nav-label{font-size:8.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#9AA7B6;padding:0 10px 5px}
.nav-list{display:flex;flex-direction:column;gap:1px}
.nav-item{
  display:flex;align-items:center;gap:10px;min-height:35px;padding:7px 10px;border-radius:9px;
  color:#536174;font-size:10.5px;font-weight:500;position:relative;transition:background .15s,color .15s;
}
.nav-item:hover{background:#F5F8FD;color:var(--text)}
.nav-item.active{background:var(--blue-soft);color:var(--blue);font-weight:600}
.nav-item.active:before{content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--blue)}
.nav-ico{width:17px;height:17px;flex:none;display:grid;place-items:center;color:currentColor}
.nav-ico svg{width:16px;height:16px}
.nav-item .nav-count{margin-left:auto;min-width:19px;height:17px;padding:0 5px;border-radius:999px;background:var(--blue);color:#fff;font-size:7.5px;font-weight:600;display:grid;place-items:center}
.nav-item .nav-count.gold{background:var(--gold);color:var(--ink)}
.sidebar-foot{padding:13px 16px 16px;border-top:1px solid var(--line);flex:none;background:#fff}
.system-note{display:flex;align-items:flex-start;gap:8px;margin-bottom:11px}
.system-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(34,164,93,.1);margin-top:5px;flex:none}
.system-note b{display:block;font-size:9px;line-height:1.3;font-weight:600;color:var(--text)}
.system-note small{display:block;font-size:7.5px;color:var(--soft);margin-top:1px}
.landing-link{display:inline-flex;align-items:center;gap:6px;font-size:9px;color:var(--blue);font-weight:500}
.landing-link:hover{text-decoration:underline}

.app-main{min-height:100vh;margin-left:var(--sidebar)}
.app-header{
  position:sticky;top:0;z-index:40;height:var(--header);
  display:grid;grid-template-columns:auto minmax(220px,480px) 1fr;align-items:center;gap:22px;
  background:rgba(255,255,255,.91);border-bottom:1px solid var(--line);backdrop-filter:blur(16px);
  padding:0 25px;
}
.header-leading{display:flex;align-items:center;gap:10px;min-width:0}
.breadcrumb{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--soft);white-space:nowrap}
.breadcrumb b{font-weight:400;color:#CDD5E0}
.breadcrumb strong{font-weight:500;color:var(--text)}
.icon-button{
  width:36px;height:36px;border:1px solid var(--line);background:#fff;border-radius:10px;
  display:grid;place-items:center;color:#647185;transition:border-color .15s,color .15s,background .15s;
}
.icon-button:hover{border-color:#BFD3F1;color:var(--blue);background:#FAFCFF}
.icon-button svg{width:17px;height:17px}
.menu-button{display:none}
.global-search{position:relative;min-width:0}
.global-search>input{
  width:100%;height:38px;border:1px solid var(--line);border-radius:999px;background:#F7FAFE;
  padding:0 64px 0 36px;font-size:10px;outline:none;color:var(--text);transition:border-color .15s,background .15s,box-shadow .15s;
}
.global-search>input::placeholder{color:#9BA8B7}
.global-search>input:focus{border-color:#AFC8F2;background:#fff;box-shadow:0 0 0 3px rgba(0,102,255,.07)}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:#7F8C9C;pointer-events:none}
.global-search kbd{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;
  padding:1px 5px;font-family:var(--font);font-size:7px;color:#8E9BAA;line-height:1.5;
}
.search-results{
  position:absolute;left:0;right:0;top:45px;z-index:80;background:#fff;border:1px solid var(--line);
  border-radius:14px;box-shadow:0 20px 40px rgba(0,57,140,.13);overflow:hidden;
  max-height:360px;overflow-y:auto;
}
.search-result{width:100%;border:0;background:#fff;padding:9px 12px;display:flex;align-items:center;gap:10px;text-align:left;border-bottom:1px solid #F0F4F9}
.search-result:last-child{border-bottom:0}
.search-result:hover{background:#F5F9FF}
.result-ico{width:28px;height:28px;border-radius:8px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none;font-size:9px;font-weight:600}
.search-result b{display:block;font-size:9.5px;font-weight:500;line-height:1.3}
.search-result span{display:block;font-size:7.5px;color:var(--soft);line-height:1.35}
.search-result .result-kind{margin-left:auto;font-size:7px;color:var(--soft);text-transform:uppercase;letter-spacing:.06em}
.search-empty{padding:18px 14px;text-align:center;color:var(--muted);font-size:9px}
.header-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0}
.header-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:#EFFAF4;color:var(--green);font-size:7.5px;font-weight:600;white-space:nowrap}
.header-badge span{width:5px;height:5px;border-radius:50%;background:currentColor}
.notification-button{position:relative}
.notif-dot{position:absolute;right:7px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--gold);border:1.5px solid #fff}
.role-control select{
  height:36px;border:1px solid var(--line);background:#F8FAFD;border-radius:10px;
  padding:0 25px 0 10px;font-size:9px;color:var(--muted);max-width:124px;cursor:pointer;
}
.header-user{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:3px 7px 3px 4px;text-align:left}
.header-user:hover{border-color:#C8D8EF}
.user-avatar{width:29px;height:29px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;display:grid;place-items:center;font-size:8px;font-weight:600;flex:none}
.user-copy{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.user-copy b{font-size:8.5px;font-weight:500;white-space:nowrap}
.user-copy small{font-size:6.7px;color:var(--soft);margin-top:2px;white-space:nowrap}
.user-chevron{font-size:11px;color:var(--soft)}
.header-new{height:36px;padding:0 12px;font-size:9px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;
  padding:7px 12px;border:1px solid var(--line-strong);border-radius:9px;background:#fff;
  color:#455265;font-size:9px;font-weight:500;white-space:nowrap;
  transition:border-color .15s,background .15s,color .15s,box-shadow .15s,transform .15s;
}
.btn:hover{border-color:#B6CCEC;color:var(--blue);background:#FAFCFF}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 15px rgba(0,102,255,.15)}
.btn-primary:hover{background:var(--blue-hover);border-color:var(--blue-hover);color:#fff;box-shadow:0 8px 20px rgba(0,102,255,.22)}
.btn-gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn-gold:hover{background:#F2AD00;border-color:#F2AD00;color:var(--ink)}
.btn-soft{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.btn-soft:hover{background:#DCE8FF;border-color:transparent;color:var(--blue)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted);padding-inline:7px}
.btn-ghost:hover{background:var(--blue-pale);color:var(--blue);border-color:transparent}
.btn.small{min-height:27px;padding:4px 8px;font-size:8px;border-radius:7px}
.btn.icon-only{width:32px;min-height:32px;padding:0}
.btn svg{width:13px;height:13px}

/* workspace */
.workspace{padding:26px 26px 46px;min-height:calc(100vh - var(--header));max-width:1660px;margin:0 auto}
.page-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:21px}
.page-kicker{font-size:8px;letter-spacing:.13em;text-transform:uppercase;color:var(--blue);font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:7px}
.page-kicker:before{content:'';width:15px;height:2px;background:var(--gold);border-radius:2px}
.page-head h1{font-family:var(--display);font-size:40px;font-weight:800;line-height:1;letter-spacing:-.025em;color:var(--ink);margin:0}
.page-head h1 em{font-style:normal;color:var(--blue)}
.page-head p{font-size:10px;color:var(--muted);max-width:70ch;margin:7px 0 0;line-height:1.6}
.page-actions{display:flex;align-items:center;flex-wrap:wrap;gap:7px}
.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;box-shadow:0 1px 1px rgba(0,57,140,.015);min-width:0;
}
.panel-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px 14px;margin-bottom:14px}
.panel-title{font-family:var(--display);font-size:23px;line-height:1.05;font-weight:800;letter-spacing:-.015em;color:var(--ink);margin:0}
.panel-sub{font-size:8px;color:var(--soft);margin:4px 0 0;line-height:1.5}
.panel-link{font-size:8.5px;font-weight:500;color:var(--blue);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.panel-link:hover{text-decoration:underline}
.panel-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.metric-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px;margin-bottom:16px}
.metric-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 15px 13px;overflow:hidden;box-shadow:0 1px 1px rgba(0,57,140,.015)}
.metric-card:after{content:'';position:absolute;right:-11px;top:-18px;width:65px;height:65px;border-radius:50%;background:var(--blue-pale);opacity:.7}
.metric-card.gold:after{background:var(--gold-pale)}
.metric-card.green:after{background:var(--green-soft)}
.metric-card.orange:after{background:var(--orange-soft)}
.metric-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;position:relative;z-index:1}
.metric-label{font-size:8px;color:var(--muted);line-height:1.35;font-weight:500;max-width:14ch}
.metric-icon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);flex:none}
.metric-icon svg{width:15px;height:15px}
.metric-card.gold .metric-icon{background:var(--gold-soft);color:var(--gold-deep)}
.metric-card.green .metric-icon{background:var(--green-soft);color:var(--green)}
.metric-card.orange .metric-icon{background:var(--orange-soft);color:var(--orange)}
.metric-value{position:relative;z-index:1;font-family:var(--display);font-size:30px;line-height:1;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin-top:8px}
.metric-value small{font-family:var(--font);font-size:10px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:2px}
.metric-foot{position:relative;z-index:1;display:flex;align-items:center;gap:5px;font-size:7.5px;color:var(--soft);margin-top:6px;min-height:13px}
.trend{display:inline-flex;align-items:center;gap:2px;font-weight:600;color:var(--green)}
.trend.down{color:var(--red)}
.trend.gold{color:var(--gold-deep)}
.grid-2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,.75fr);gap:13px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.grid-main{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:13px}
.stack{display:flex;flex-direction:column;gap:13px}
.mt-13{margin-top:13px}
.mt-18{margin-top:18px}

/* chart */
.chart-shell{position:relative;min-height:230px}
.line-chart{display:block;width:100%;height:auto;overflow:visible}
.line-chart .grid-line{stroke:#E9EEF5;stroke-width:1}
.line-chart .axis-label{fill:#8B98A9;font-family:var(--font);font-size:7px;font-weight:400}
.line-chart .axis-label.gold{fill:var(--gold-deep);font-weight:600}
.line-chart .series-blue{fill:none;stroke:var(--blue);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.line-chart .series-gold{fill:none;stroke:var(--gold);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.line-chart .area-blue{fill:url(#areaBlue)}
.line-chart .dot-blue{fill:var(--blue);stroke:#fff;stroke-width:2}
.line-chart .dot-gold{fill:var(--gold);stroke:#fff;stroke-width:2}
.chart-legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:7.5px;color:var(--muted);margin-top:5px}
.chart-legend span{display:inline-flex;align-items:center;gap:5px}
.legend-dot{width:6px;height:6px;border-radius:50%;background:var(--blue)}
.legend-dot.gold{background:var(--gold)}
.chart-tabs{display:inline-flex;padding:2px;background:#F4F7FC;border:1px solid var(--line);border-radius:8px;gap:2px}
.chart-tab{border:0;background:transparent;border-radius:6px;padding:4px 8px;font-size:7.5px;font-weight:500;color:var(--soft)}
.chart-tab.active{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,57,140,.08)}
.donut-wrap{display:flex;align-items:center;gap:17px}
.donut{width:112px;height:112px;border-radius:50%;position:relative;flex:none;display:grid;place-items:center;background:conic-gradient(var(--blue) 0 78%,#E8EEF6 78% 100%)}
.donut:before{content:'';position:absolute;inset:10px;border-radius:50%;background:#fff}
.donut-content{position:relative;text-align:center;line-height:1}
.donut-content b{font-family:var(--display);font-size:30px;font-weight:800;color:var(--ink)}
.donut-content small{display:block;font-size:7px;color:var(--soft);margin-top:2px}
.legend-list{display:flex;flex-direction:column;gap:7px;width:100%}
.legend-row{display:flex;align-items:center;gap:7px;font-size:8px}
.legend-row .sw{width:7px;height:7px;border-radius:3px;flex:none}
.legend-row span{color:var(--muted)}
.legend-row b{margin-left:auto;font-weight:500;color:var(--text);white-space:nowrap}
.mini-bars{height:118px;display:flex;align-items:flex-end;gap:8px;padding-top:15px}
.mini-bar-col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;min-width:0}
.mini-bar-track{width:100%;max-width:24px;height:100%;display:flex;align-items:flex-end;background:#F4F7FB;border-radius:5px 5px 2px 2px;overflow:hidden}
.mini-bar-track i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,#4A92FF,var(--blue))}
.mini-bar-col:nth-child(3n) .mini-bar-track i{background:linear-gradient(180deg,var(--gold),#F0AE00)}
.mini-bar-col span{font-size:6.5px;color:var(--soft);white-space:nowrap}

/* lists, tasks */
.worklist{display:flex;flex-direction:column}
.work-item{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:9px;align-items:center;padding:10px 0;border-top:1px solid #EEF2F7}
.work-item:first-child{border-top:0;padding-top:1px}
.work-item:last-child{padding-bottom:0}
.work-icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);flex:none}
.work-icon svg{width:15px;height:15px}
.work-icon.gold{background:var(--gold-soft);color:var(--gold-deep)}
.work-icon.green{background:var(--green-soft);color:var(--green)}
.work-icon.orange{background:var(--orange-soft);color:var(--orange)}
.work-copy{min-width:0}
.work-copy b{display:block;font-size:8.5px;line-height:1.4;font-weight:500}
.work-copy span{display:block;font-size:7.5px;line-height:1.4;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.work-action{display:flex;align-items:center;gap:4px}
.task-list{display:flex;flex-direction:column;gap:8px}
.task-card{padding:11px 12px;background:#F8FAFD;border:1px solid #EBF0F6;border-radius:10px;display:flex;align-items:flex-start;gap:9px}
.task-card .task-ico{width:27px;height:27px;border-radius:8px;background:#fff;color:var(--blue);display:grid;place-items:center;flex:none;border:1px solid #E3EBF5}
.task-card b{display:block;font-size:8.5px;font-weight:500;line-height:1.4}
.task-card p{font-size:7.5px;color:var(--soft);margin:2px 0 0;line-height:1.5}
.task-card .task-num{margin-left:auto;font-family:var(--display);font-size:20px;font-weight:800;line-height:1;color:var(--blue)}
.table-shell{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#fff}
.data-table{width:100%;border-collapse:collapse;font-size:8.5px}
.data-table th{text-align:left;background:#F7FAFE;border-bottom:1px solid var(--line);color:#8491A2;text-transform:uppercase;letter-spacing:.06em;font-size:7px;font-weight:600;padding:8px 10px;white-space:nowrap}
.data-table td{padding:9px 10px;border-bottom:1px solid #EEF2F7;vertical-align:middle}
.data-table tr:last-child td{border-bottom:0}
.data-table tbody tr{cursor:pointer;transition:background .13s}
.data-table tbody tr:hover{background:#FAFCFF}
.data-table .main-cell{min-width:150px}
.main-cell b{display:block;font-size:9px;line-height:1.35;font-weight:500;color:var(--text)}
.main-cell span{display:block;font-size:7.2px;color:var(--soft);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.table-actions{text-align:right;white-space:nowrap}
.row-actions{display:inline-flex;align-items:center;gap:4px;justify-content:flex-end}
.row-action{border:0;background:transparent;color:var(--soft);width:25px;height:25px;border-radius:6px;display:grid;place-items:center}
.row-action:hover{background:var(--blue-soft);color:var(--blue)}
.row-action svg{width:13px;height:13px}
.status{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:999px;font-size:6.8px;font-weight:500;white-space:nowrap;line-height:1.55}
.status:before{content:'';width:4px;height:4px;border-radius:50%;background:currentColor;flex:none}
.status-blue{background:var(--blue-soft);color:var(--blue)}
.status-green{background:var(--green-soft);color:var(--green)}
.status-gold{background:var(--gold-soft);color:var(--gold-deep)}
.status-orange{background:var(--orange-soft);color:var(--orange)}
.status-red{background:var(--red-soft);color:var(--red)}
.status-violet{background:var(--violet-soft);color:var(--violet)}
.status-gray{background:#F0F3F7;color:#798696}
.status.bare:before{display:none}
.tag{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 6px;border-radius:5px;background:var(--blue-pale);color:var(--blue);font-size:6.8px;font-weight:500;white-space:nowrap}
.tag.gold{background:var(--gold-soft);color:var(--gold-deep)}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.orange{background:var(--orange-soft);color:var(--orange)}
.tag.gray{background:#F2F4F7;color:#7D8898}
.progress{height:5px;background:#EDF1F6;border-radius:999px;overflow:hidden}
.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:inherit;transition:width .3s ease}
.progress.gold>span{background:linear-gradient(90deg,var(--gold),#FFD968)}

/* filters/forms */
.filter-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:12px}
.field-wrap{position:relative;flex:1 1 210px;min-width:160px}
.field-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:#8794A4;pointer-events:none}
.form-field{
  border:1px solid var(--line);background:#F9FBFE;border-radius:8px;min-height:33px;
  padding:6px 9px;font-size:8.5px;color:var(--text);width:100%;outline:none;
  transition:border-color .15s,background .15s,box-shadow .15s;
}
.field-wrap .form-field{padding-left:29px}
.form-field::placeholder{color:#9CA9B8}
.form-field:focus{border-color:#AFC8F2;background:#fff;box-shadow:0 0 0 3px rgba(0,102,255,.06)}
select.form-field{cursor:pointer;min-width:120px;width:auto;padding-right:24px}
.filter-bar>.form-field{flex:0 1 auto;min-width:112px;width:auto}
.filter-count{margin-left:auto;font-size:8px;color:var(--soft);white-space:nowrap}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.form-row{display:flex;flex-direction:column;gap:4px}
.form-row.full{grid-column:1/-1}
.form-row label{font-size:7.5px;font-weight:500;color:#6E7B8B}
.form-row label em{color:var(--red);font-style:normal}
.form-row textarea.form-field{min-height:74px;resize:vertical;padding:8px 9px;line-height:1.5}
.form-help{font-size:6.9px;color:var(--soft);line-height:1.45}
.empty-state{padding:30px 20px;text-align:center;color:var(--soft);font-size:9px}
.empty-state b{display:block;color:var(--text);font-size:10px;margin-bottom:3px}
.empty-state p{margin:0}

/* module tiles */
.module-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.module-tile{
  display:flex;align-items:center;gap:10px;min-width:0;padding:12px;border:1px solid var(--line);
  border-radius:12px;background:#fff;text-align:left;transition:border-color .15s,box-shadow .15s,transform .15s;
}
.module-tile:hover{border-color:#BCD0EE;box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.module-tile .module-ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);flex:none}
.module-tile:nth-child(3n) .module-ico{background:var(--gold-soft);color:var(--gold-deep)}
.module-tile:nth-child(4n) .module-ico{background:var(--green-soft);color:var(--green)}
.module-tile b{display:block;font-size:8.7px;font-weight:500;line-height:1.35}
.module-tile span{display:block;font-size:7px;color:var(--soft);line-height:1.35;margin-top:2px}
.module-tile .tile-arrow{margin-left:auto;color:#A9B5C3;font-size:11px}

/* AI insight panel */
.ai-panel{background:linear-gradient(135deg,#073F96 0%,#0066FF 67%,#1E95F2 100%);color:#fff;border:0;box-shadow:0 16px 35px rgba(0,77,191,.18);overflow:hidden;position:relative}
.ai-panel:before{content:'';position:absolute;right:-35px;top:-55px;width:180px;height:180px;border:1px solid rgba(255,255,255,.12);border-radius:50%}
.ai-panel:after{content:'';position:absolute;right:20px;top:20px;width:80px;height:80px;border:1px dashed rgba(255,255,255,.1);border-radius:50%}
.ai-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;position:relative;z-index:1}
.ai-mark{width:30px;height:30px;border-radius:0;background:none;color:transparent;display:grid;place-items:center;font-size:0;overflow:hidden}
.ai-mark svg{width:100%;height:100%;display:block}
.ai-head b{display:block;font-size:8.8px;font-weight:500;line-height:1.25}
.ai-head small{display:block;font-size:6.8px;color:rgba(255,255,255,.55);margin-top:1px}
.ai-head .tag{margin-left:auto;background:rgba(255,255,255,.12);color:#fff}
.ai-panel h3{font-family:var(--display);font-size:23px;line-height:1.05;font-weight:700;margin:0 0 6px;position:relative;z-index:1;max-width:18ch}
.ai-panel p{font-size:8px;line-height:1.65;color:rgba(255,255,255,.64);margin:0 0 13px;max-width:46ch;position:relative;z-index:1}
.ai-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;position:relative;z-index:1;margin-bottom:12px}
.ai-metric{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.11);border-radius:9px;padding:8px}
.ai-metric b{display:block;font-family:var(--display);font-size:20px;line-height:1;font-weight:800}
.ai-metric span{display:block;font-size:6.5px;color:rgba(255,255,255,.55);margin-top:3px}
.ai-panel .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.16);color:#fff;position:relative;z-index:1}
.ai-panel .btn:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.32);color:#fff}

/* overview extras */
.quick-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:16px}
.quick-action{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 11px;text-align:left;transition:border-color .15s,box-shadow .15s}
.quick-action:hover{border-color:#BED2F0;box-shadow:var(--shadow-sm)}
.quick-action .qa-ico{width:27px;height:27px;border-radius:8px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none}
.quick-action:nth-child(2n) .qa-ico{background:var(--gold-soft);color:var(--gold-deep)}
.quick-action b{display:block;font-size:8.2px;font-weight:500;line-height:1.35}
.quick-action span{display:block;font-size:6.8px;color:var(--soft)}
.quick-action .qa-arr{margin-left:auto;color:#B0BAC7;font-size:10px}
.alert-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #EEF2F7}
.alert-row:first-child{padding-top:0}
.alert-row:last-child{border-bottom:0;padding-bottom:0}
.alert-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none}
.alert-row b{display:block;font-size:8.3px;font-weight:500;line-height:1.38}
.alert-row span{display:block;font-size:7px;color:var(--soft);margin-top:1px}
.alert-row .status{margin-left:auto}
.ward-list{display:flex;flex-direction:column;gap:8px}
.ward-row{display:grid;grid-template-columns:minmax(0,1fr) 70px 23px;align-items:center;gap:8px;font-size:7.8px}
.ward-row b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ward-row .progress{height:4px}
.ward-row span:last-child{text-align:right;color:var(--muted)}

/* patient / clinical cards */
.profile-strip{display:grid;grid-template-columns:minmax(0,1.2fr) repeat(3,minmax(0,.6fr));gap:10px;margin-bottom:13px}
.profile-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;display:flex;align-items:center;gap:9px;min-width:0}
.mini-avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#DDE9FF,#EDF5FF);color:var(--blue);display:grid;place-items:center;font-size:9px;font-weight:600;flex:none}
.profile-card .pc-copy{min-width:0}
.profile-card small{display:block;font-size:6.8px;color:var(--soft);margin-bottom:1px}
.profile-card b{display:block;font-size:9px;line-height:1.35;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-card span{display:block;font-size:6.9px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-card .pc-value{margin-left:auto;font-family:var(--display);font-size:20px;font-weight:800;color:var(--blue);flex:none}
.pill-tabs{display:flex;align-items:center;gap:3px;flex-wrap:wrap;background:#F5F8FD;border:1px solid var(--line);padding:3px;border-radius:9px;width:max-content;max-width:100%}
.pill-tab{border:0;background:transparent;border-radius:6px;padding:4px 9px;font-size:7.5px;color:var(--soft);white-space:nowrap}
.pill-tab.active{background:#fff;color:var(--blue);font-weight:500;box-shadow:0 1px 4px rgba(0,57,140,.08)}
.queue-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;align-items:start}
.queue-column{background:#F6F9FE;border:1px solid #E8EEF6;border-radius:12px;padding:8px;min-width:0}
.queue-head{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:1px 2px 7px}
.queue-head b{font-size:8px;font-weight:500}
.queue-head span{font-size:6.8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 5px;color:var(--soft)}
.queue-card{background:#fff;border:1px solid #E2E9F2;border-radius:9px;padding:9px;margin-bottom:6px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.queue-card:hover{border-color:#BCD2F1;box-shadow:0 4px 12px rgba(0,57,140,.05)}
.queue-card:last-child{margin-bottom:0}
.queue-card-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.queue-card .q-time{font-family:var(--mono);font-size:7.2px;color:var(--soft)}
.queue-card b{display:block;font-size:8.4px;line-height:1.35;font-weight:500;margin-top:4px}
.queue-card p{font-size:7px;line-height:1.4;color:var(--soft);margin:2px 0 7px}
.queue-card .btn{width:100%;min-height:23px;padding:2px 5px;font-size:6.8px}
.bed-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
.bed-card{position:relative;border:1px solid #E4EAF3;border-radius:9px;padding:8px 7px;background:#fff;min-height:64px;text-align:left;transition:transform .15s,border-color .15s,box-shadow .15s}
.bed-card:hover{transform:translateY(-1px);border-color:#BFD1EB;box-shadow:var(--shadow-sm)}
.bed-card b{display:block;font-family:var(--mono);font-size:8px;font-weight:600;line-height:1.2}
.bed-card span{display:block;font-size:6.5px;color:var(--soft);line-height:1.35;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bed-card .bed-status{position:absolute;right:6px;top:6px;width:5px;height:5px;border-radius:50%;background:var(--soft)}
.bed-card.terisi{background:#F8FBFF;border-color:#D5E3F7}
.bed-card.terisi .bed-status{background:var(--blue)}
.bed-card.kosong .bed-status{background:var(--green)}
.bed-card.bersih .bed-status{background:var(--gold)}
.bed-card.maintenance .bed-status{background:var(--red)}
.bed-card.kosong{border-style:dashed}
.bed-legend{display:flex;flex-wrap:wrap;gap:9px;font-size:7px;color:var(--soft);margin-top:9px}
.bed-legend span{display:inline-flex;align-items:center;gap:4px}
.bed-legend i{width:5px;height:5px;border-radius:50%;background:var(--soft)}
.bed-legend .i-blue{background:var(--blue)}.bed-legend .i-green{background:var(--green)}.bed-legend .i-gold{background:var(--gold)}.bed-legend .i-red{background:var(--red)}
.triage-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.triage-col{background:#F7FAFE;border:1px solid #E8EEF6;border-radius:12px;padding:8px;min-width:0}
.triage-head{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 2px 7px}
.triage-head b{font-size:8px;font-weight:500;display:flex;align-items:center;gap:5px}
.triage-head b i{width:6px;height:6px;border-radius:50%;background:var(--soft)}
.triage-head.red b i{background:var(--red)}.triage-head.orange b i{background:var(--orange)}.triage-head.blue b i{background:var(--blue)}.triage-head.green b i{background:var(--green)}
.triage-head span{font-size:6.8px;color:var(--soft)}
.triage-card{background:#fff;border:1px solid #E2E9F2;border-radius:9px;padding:8px;margin-bottom:6px}
.triage-card-top{display:flex;justify-content:space-between;gap:6px;align-items:center}
.triage-card .mono{font-size:6.8px;color:var(--soft)}
.triage-card b{display:block;font-size:8px;line-height:1.35;font-weight:500;margin-top:3px}
.triage-card p{font-size:6.7px;color:var(--soft);margin:2px 0 6px;line-height:1.4}
.triage-card .btn{width:100%;min-height:22px;font-size:6.5px;padding:2px 4px}
.vitals-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:8px 0 12px}
.vital-box{background:#F8FAFD;border:1px solid #E8EEF6;border-radius:8px;padding:7px}
.vital-box small{display:block;font-size:6.5px;color:var(--soft)}
.vital-box b{display:block;font-size:10px;font-weight:500;margin-top:1px}
.vital-box span{font-size:6px;color:var(--green)}

/* pharmacy/lab etc */
.order-list{display:flex;flex-direction:column;gap:7px}
.order-card{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:9px;padding:9px;border:1px solid #E7EDF5;border-radius:9px;background:#fff}
.order-card:hover{border-color:#C5D6ED}
.order-id{width:34px;height:34px;border-radius:8px;background:var(--blue-pale);color:var(--blue);display:grid;place-items:center;font-family:var(--mono);font-size:7px;font-weight:600;text-align:center;line-height:1.2}
.order-card b{display:block;font-size:8.4px;font-weight:500;line-height:1.35}
.order-card span{display:block;font-size:6.9px;color:var(--soft);margin-top:1px}
.order-card .btn{min-height:24px;font-size:6.8px;padding:2px 6px}
.stage-track{display:flex;align-items:center;gap:4px;margin-top:6px}
.stage-track i{width:6px;height:6px;border-radius:50%;background:#E3EAF3}
.stage-track i.on{background:var(--blue)}
.stage-track i.gold{background:var(--gold)}
.stage-labels{display:flex;justify-content:space-between;gap:4px;font-size:5.8px;color:var(--soft);margin-top:3px}
.line-item-table td{font-size:8px}
.line-item-table .qty{text-align:center}
.line-item-table .amount{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.summary-line{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:8px;color:var(--muted)}
.summary-line b{font-weight:500;color:var(--text)}
.summary-total{border-top:1px dashed var(--line-strong);margin-top:5px;padding-top:9px;font-family:var(--display);font-size:21px;font-weight:800;color:var(--ink);display:flex;justify-content:space-between;gap:10px}
.invoice-badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:7px;background:#FAFCFF;padding:4px 7px;font-family:var(--mono);font-size:7px;color:var(--muted)}
.receipt-box{border:1px dashed #CBD9EA;border-radius:11px;padding:13px;background:#FBFDFF}
.receipt-head{text-align:center;padding-bottom:9px;border-bottom:1px dashed var(--line-strong);margin-bottom:8px}
.receipt-head b{display:block;font-size:10px}
.receipt-head span{display:block;font-size:6.8px;color:var(--soft);margin-top:2px}

/* OCR */
.ocr-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr);gap:13px;align-items:start}
.ocr-workbench{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(260px,.9fr);gap:13px;align-items:start}
.dropzone{
  position:relative;border:1.5px dashed #B6CCEB;border-radius:13px;background:linear-gradient(180deg,#F8FBFF,#F5F9FF);
  padding:26px 18px;text-align:center;transition:border-color .15s,background .15s;
}
.dropzone.dragover{border-color:var(--blue);background:#EDF5FF}
.dropzone-icon{width:48px;height:48px;border-radius:13px;background:#fff;border:1px solid #D9E6F7;color:var(--blue);display:grid;place-items:center;margin:0 auto 10px;box-shadow:var(--shadow-sm)}
.dropzone-icon svg{width:23px;height:23px}
.dropzone h3{font-family:var(--display);font-size:22px;line-height:1;font-weight:800;margin:0 0 4px}
.dropzone p{font-size:7.8px;color:var(--soft);margin:0 auto 11px;max-width:38ch;line-height:1.6}
.dropzone-actions{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.dropzone input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.ocr-file-row{display:flex;align-items:center;gap:9px;padding:10px;margin-top:8px;border:1px solid #E3EBF5;border-radius:9px;background:#fff}
.ocr-file-ico{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--blue-pale);color:var(--blue);font-size:7px;font-weight:600;flex:none}
.ocr-file-row b{display:block;font-size:8px;line-height:1.3;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocr-file-row span{display:block;font-size:6.8px;color:var(--soft);margin-top:1px}
.ocr-file-row .status{margin-left:auto;flex:none}
.ocr-preview{border:1px solid #E3EAF3;border-radius:11px;background:#FBFDFF;min-height:265px;padding:12px;position:relative;overflow:hidden}
.ocr-result-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:12px;align-items:start}
.paper-sheet{background:#fff;border:1px solid #E4EAF2;border-radius:6px;box-shadow:0 7px 18px rgba(0,57,140,.06);padding:12px;font-family:var(--mono);font-size:6.4px;color:#657385;line-height:1.7;position:relative}
.paper-sheet:before{content:'RS MEDIKA NUSANTARA';display:block;text-align:center;font-size:7px;letter-spacing:.09em;font-weight:600;color:var(--ink);border-bottom:1px solid #DCE5F0;padding-bottom:6px;margin-bottom:7px}
.paper-sheet .record-title{font-family:var(--font);font-size:8px;font-weight:600;color:var(--ink);margin-bottom:4px}
.paper-sheet mark{background:#FFF0A8;color:var(--ink);padding:0 2px;border-radius:2px}
.paper-sheet .doc-preview-img{width:100%;height:210px;object-fit:contain;background:#F5F8FC;border-radius:4px;margin-top:4px}
.ocr-job-list{display:flex;flex-direction:column;gap:7px;max-height:300px;overflow-y:auto}
.ocr-job{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid #E7EDF5;border-radius:8px;background:#fff;text-align:left;width:100%}
.ocr-job:hover,.ocr-job.active{border-color:#ABC8F2;background:#F7FAFF}
.ocr-job b{display:block;font-size:7.8px;font-weight:500;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22ch}
.ocr-job span{display:block;font-size:6.5px;color:var(--soft)}
.ocr-job .status{margin-left:auto;flex:none}
.ocr-queue-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:13px 0 7px}
.ocr-queue-head b{font-size:8.5px;font-weight:500}
.ocr-queue-head span{font-size:7px;color:var(--soft)}
.ocr-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.ocr-field{display:flex;flex-direction:column;gap:3px}
.ocr-field.full{grid-column:1/-1}
.ocr-field label{font-size:6.8px;color:var(--soft);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.ocr-field input,.ocr-field select,.ocr-field textarea{font-size:8px;border:1px solid var(--line);border-radius:7px;min-height:30px;background:#FBFDFF;padding:5px 7px;outline:none}
.ocr-field input:focus,.ocr-field select:focus,.ocr-field textarea:focus{border-color:#AFC8F2;background:#fff}
.ocr-confidence{display:flex;align-items:center;gap:6px;margin:10px 0 12px;padding:7px 8px;background:var(--green-soft);border-radius:7px;font-size:7px;color:var(--green)}
.ocr-confidence b{margin-left:auto;font-weight:600}
.ocr-help{font-size:6.6px;color:var(--soft);line-height:1.5;margin:9px 0 0}
.processing{height:6px;background:#EAF0F8;border-radius:999px;overflow:hidden;margin:9px 0 4px}
.processing span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan),var(--gold));transition:width .25s}

/* integrations */
.integration-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.integration-card{border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px;display:flex;flex-direction:column;min-height:135px}
.int-top{display:flex;align-items:flex-start;gap:8px}
.int-logo{width:31px;height:31px;border-radius:8px;background:var(--blue-pale);color:var(--blue);display:grid;place-items:center;font-size:7px;font-weight:600;flex:none}
.int-top b{display:block;font-size:9px;font-weight:500;line-height:1.3}
.int-top span{display:block;font-size:6.8px;color:var(--soft);margin-top:1px}
.int-status{margin-left:auto}
.integration-card p{font-size:7.5px;color:var(--muted);line-height:1.55;margin:8px 0;flex:1}
.int-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;padding-top:8px;border-top:1px solid #EEF2F7;font-size:6.7px;color:var(--soft)}
.int-foot .btn{min-height:23px;font-size:6.7px;padding:2px 6px}
.switch{position:relative;width:30px;height:17px;display:inline-block;flex:none}
.switch input{opacity:0;position:absolute;width:1px;height:1px}
.switch-track{position:absolute;inset:0;background:#DCE4EE;border-radius:999px;transition:background .18s}
.switch-track:after{content:'';position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:transform .18s}
.switch input:checked+.switch-track{background:var(--blue)}
.switch input:checked+.switch-track:after{transform:translateX(13px)}
.fhir-preview{background:#0C1830;color:#D6E4FF;border-radius:10px;padding:12px;font-family:var(--mono);font-size:7px;line-height:1.6;max-height:280px;overflow:auto;white-space:pre-wrap}
.fhir-preview .key{color:#8AB4FF}.fhir-preview .str{color:#A6E3A1}.fhir-preview .num{color:#FFD86B}

/* finance charts etc */
.finance-bars{display:flex;align-items:flex-end;gap:7px;height:170px;padding-top:10px}
.finance-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.finance-bar{width:100%;max-width:28px;background:linear-gradient(180deg,#4A92FF,var(--blue));border-radius:4px 4px 2px 2px;min-height:5px}
.finance-bar.gold{background:linear-gradient(180deg,var(--gold),#E2A500)}
.finance-bar-col span{font-size:6.5px;color:var(--soft)}
.split-bar{display:flex;height:18px;border-radius:5px;overflow:hidden;background:#EEF2F7;margin:8px 0 11px}
.split-bar span{height:100%}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.aging-list{display:flex;flex-direction:column;gap:9px}
.aging-row{display:flex;align-items:center;gap:8px;font-size:7.5px}
.aging-row span{width:64px;color:var(--muted)}
.aging-row .progress{flex:1}
.aging-row b{width:49px;text-align:right;font-weight:500;font-size:7.3px}

/* modal/drawer */
.overlay{position:fixed;inset:0;z-index:90;background:rgba(2,18,46,.38);opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.on{opacity:1;pointer-events:auto}
.side-drawer{
  position:fixed;top:0;right:0;bottom:0;z-index:100;width:min(520px,100%);background:#fff;
  transform:translateX(102%);transition:transform .25s cubic-bezier(.2,.75,.2,1);
  box-shadow:-18px 0 50px rgba(0,26,67,.13);display:flex;flex-direction:column;
}
.side-drawer.on{transform:none}
.drawer-head{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex:none}
.drawer-kicker{font-size:7px;color:var(--blue);text-transform:uppercase;letter-spacing:.1em;font-weight:500;margin-bottom:3px}
.drawer-head h2{font-family:var(--display);font-size:26px;line-height:1;letter-spacing:-.02em;font-weight:800;margin:0}
.drawer-head p{font-size:8px;color:var(--soft);margin:5px 0 0;line-height:1.5}
.drawer-close{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);font-size:20px;line-height:1;flex:none}
.drawer-close:hover{border-color:#C4D5EB;color:var(--text)}
.drawer-body{padding:17px 18px;overflow-y:auto;flex:1;background:#FBFDFF}
.drawer-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;flex-wrap:wrap;gap:6px;background:#fff;flex:none}
.drawer-section{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}
.drawer-section:last-child{margin-bottom:0}
.drawer-section h3{font-family:var(--display);font-size:20px;line-height:1;font-weight:800;margin:0 0 9px}
.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 12px}
.detail-item span{display:block;font-size:6.7px;color:var(--soft);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.detail-item b{display:block;font-size:8.3px;line-height:1.45;font-weight:500}
.timeline{display:flex;flex-direction:column;position:relative;padding-left:14px}
.timeline:before{content:'';position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:#E3EAF3}
.timeline-item{position:relative;padding:0 0 11px}
.timeline-item:last-child{padding-bottom:0}
.timeline-item:before{content:'';position:absolute;left:-14px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px #EAF1FF}
.timeline-item b{display:block;font-size:8px;font-weight:500;line-height:1.4}
.timeline-item span{display:block;font-size:7px;color:var(--soft);margin-top:1px}
.timeline-item p{font-size:7.3px;color:var(--muted);margin:2px 0 0;line-height:1.5}
.sidebar-mini{background:var(--blue-pale);border:1px solid #DDE9FB;border-radius:10px;padding:10px;margin-bottom:10px}
.sidebar-mini b{display:block;font-size:8px;font-weight:500}
.sidebar-mini p{font-size:7px;line-height:1.5;color:var(--muted);margin:3px 0 0}
.modal-root{
  position:fixed;inset:0;z-index:110;background:rgba(2,18,46,.42);
  display:none;align-items:center;justify-content:center;padding:22px;
}
.modal-root.on{display:flex}
.modal{background:#fff;border-radius:18px;box-shadow:0 30px 70px rgba(0,26,67,.25);width:min(570px,100%);max-height:min(86vh,700px);display:flex;flex-direction:column;overflow:hidden;animation:modalIn .22s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.modal-head{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex:none}
.modal-head h2{font-family:var(--display);font-size:27px;line-height:1;font-weight:800;margin:0}
.modal-head p{font-size:8px;color:var(--soft);margin:4px 0 0;line-height:1.45}
.modal-body{padding:17px 18px;overflow-y:auto;background:#FBFDFF;flex:1}
.modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap;background:#fff;flex:none}
.modal .form-grid{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px}
.modal .form-row label{font-size:7px}
.modal .form-field{background:#FBFDFF}
.confirm-summary{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px;margin-top:10px}
.confirm-summary p{font-size:7.8px;color:var(--muted);line-height:1.6;margin:0}
.notif-list{display:flex;flex-direction:column;gap:0}
.notif-item{display:grid;grid-template-columns:27px minmax(0,1fr);gap:9px;padding:11px 0;border-bottom:1px solid #EEF2F7;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.notif-item:last-child{border-bottom:0}
.notif-item:hover{background:#F8FBFF}
.notif-ico{width:27px;height:27px;border-radius:8px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:10px}
.notif-item.gold .notif-ico{background:var(--gold-soft);color:var(--gold-deep)}
.notif-item b{display:block;font-size:8.5px;font-weight:500;line-height:1.4}
.notif-item p{font-size:7.3px;color:var(--soft);line-height:1.45;margin:1px 0 0}
.notif-item span{font-size:6.5px;color:#A7B3C0;margin-top:2px;display:block}

/* toast */
.toast{
  position:fixed;left:50%;bottom:22px;z-index:140;transform:translate(-50%,18px);
  background:#0B1A32;color:#fff;border-radius:10px;padding:9px 13px;font-size:8.5px;font-weight:400;
  box-shadow:0 12px 30px rgba(0,18,50,.24);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  max-width:min(500px,calc(100vw - 30px));text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.success{border-left:3px solid var(--green)}
.toast.warning{border-left:3px solid var(--gold)}

/* auditing */
.audit-table .data-table td{font-size:7.7px}
.code-block{background:#0C1830;color:#D6E4FF;border-radius:9px;padding:10px;font-family:var(--mono);font-size:7px;line-height:1.6;white-space:pre-wrap;overflow:auto}
.scribe-status{display:flex;align-items:center;gap:7px;background:#F6F9FE;border:1px solid var(--line);border-radius:8px;padding:8px 9px;font-size:8px;color:var(--muted)}
.scribe-status>span{width:7px;height:7px;border-radius:50%;background:var(--soft);flex:none}
.scribe-status>.dot-live{background:var(--red);box-shadow:0 0 0 3px rgba(214,69,69,.1);animation:pulseLive 1.2s infinite}
.scribe-status>.dot-warn{background:var(--gold)}
@keyframes pulseLive{50%{opacity:.4}}

(function(){
'use strict';

var $=function(sel,root){return (root||document).querySelector(sel)};
var $$=function(sel,root){return Array.prototype.slice.call((root||document).querySelectorAll(sel))};
var rootEl=document.documentElement;

function esc(value){
  return String(value==null?'':value).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function money(value){
  return 'Rp '+Number(value||0).toLocaleString('id-ID');
}
function shortMoney(value){
  var n=Number(value||0);
  if(n>=1000000000)return 'Rp '+(n/1000000000).toLocaleString('id-ID',{maximumFractionDigits:1})+' M';
  if(n>=1000000)return 'Rp '+(n/1000000).toLocaleString('id-ID',{maximumFractionDigits:1})+' jt';
  if(n>=1000)return 'Rp '+(n/1000).toLocaleString('id-ID',{maximumFractionDigits:0})+' rb';
  return 'Rp '+n.toLocaleString('id-ID');
}
function initials(name){
  return String(name||'').replace(/^(Ny\.|Tn\.|An\.|By\. Ny\.)\s*/i,'').split(/\s+/).filter(Boolean).slice(0,2).map(function(part){return part.charAt(0)}).join('').toUpperCase();
}
function icon(name,className){
  var paths=ICONS[name]||ICONS.dot;
  return '<svg class="'+(className||'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+paths+'</svg>';
}
function pill(text,kind,extra){
  var cls=kind||statusClass(text);
  return '<span class="status '+cls+(extra?' '+extra:'')+'">'+esc(text)+'</span>';
}
function tag(text,kind){
  return '<span class="tag '+(kind||'')+'">'+esc(text)+'</span>';
}
function statusClass(text){
  var v=String(text||'').toLowerCase();
  if(/selesai|lunas|aktif|normal|disetujui|terhubung|stabil|valid|siap|sudah|confirmed|terpenuhi|diserahkan/.test(v))return 'status-green';
  if(/tinggi|kritis|merah|ditolak|gagal|terlambat|kedaluwarsa|p1|berisiko/.test(v))return 'status-red';
  if(/menunggu|pending|antrean|review|sedang|p2|persiapan|berlangsung|parsial|bersih/.test(v))return 'status-gold';
  if(/dikonfirmasi|dipanggil|konsultasi|sampling|analisis|validasi|proses|dikirim|terjadwal|p3|pemeriksaan/.test(v))return 'status-blue';
  if(/asuransi|tpa|dispute|vip|khusus|isolasi/.test(v))return 'status-violet';
  if(/maintenance|nonaktif|batal|belum|draft/.test(v))return 'status-gray';
  return 'status-gray';
}
var toastTimer;
function toast(message,type){
  toastEl.textContent=message;
  toastEl.className='toast on '+(type||'');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toastEl.className='toast '+(type||'')},2800);
}
function openDrawer(kicker,title,sub,body,foot){
  drawer.innerHTML='<div class="drawer-head"><div><div class="drawer-kicker">'+esc(kicker)+'</div><h2>'+title+'</h2>'+(sub?'<p>'+esc(sub)+'</p>':'')+'</div><button class="drawer-close" type="button" data-action="close-drawer" aria-label="Tutup">×</button></div>'+
    '<div class="drawer-body">'+body+'</div>'+
    (foot?'<div class="drawer-foot">'+foot+'</div>':'');
  drawer.classList.add('on');
  drawer.setAttribute('aria-hidden','false');
  overlay.classList.add('on');
  document.body.classList.add('drawer-open');
  setTimeout(function(){var close=drawer.querySelector('.drawer-close');if(close)close.focus()},30);
}
function closeDrawer(){
  drawer.classList.remove('on');
  drawer.setAttribute('aria-hidden','true');
  if(!modalRoot.classList.contains('on')){
    overlay.classList.remove('on');
    document.body.classList.remove('drawer-open');
  }
}
function openModal(kicker,title,sub,body,foot){
  modalRoot.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><div class="drawer-kicker">'+esc(kicker)+'</div><h2 id="modalTitle">'+title+'</h2>'+(sub?'<p>'+esc(sub)+'</p>':'')+'</div><button class="drawer-close" type="button" data-action="close-modal" aria-label="Tutup">×</button></div><div class="modal-body">'+body+'</div>'+(foot?'<div class="modal-foot">'+foot+'</div>':'')+'</div>';
  modalRoot.classList.add('on');
  modalRoot.setAttribute('aria-hidden','false');
  overlay.classList.add('on');
  document.body.classList.add('modal-open');
  var first=modalRoot.querySelector('input,select,textarea,button');
  if(first)setTimeout(function(){first.focus()},20);
}
function closeModal(){
  if(scribeRecognition){
    try{scribeRecognition.stop()}catch(e){}
    scribeRecognition=null;
  }
  modalRoot.classList.remove('on');
  modalRoot.setAttribute('aria-hidden','true');
  modalRoot.innerHTML='';
  if(!drawer.classList.contains('on')){
    overlay.classList.remove('on');
    document.body.classList.remove('modal-open');
  }
}
function closeAllPanels(){
  closeDrawer();
  closeModal();
  overlay.classList.remove('on');
  document.body.classList.remove('drawer-open','modal-open');
}
function logAction(message,module){
  DATA.audit.unshift({
    id:'AUD-'+String(4090+DATA.audit.length).padStart(4,'0'),
    actor:state.role,
    action:message,
    module:module||MODULE_LABEL[state.route]||'Workspace',
    time:'Baru saja',
    ip:'10.24.8.'+(18+Math.floor(Math.random()*18))
  });
}

}

function lineChart(labels,a,b,chartId){
  var W=660,H=222,pl=30,pr=16,pt=14,pb=28;
  var all=a.concat(b||[]);
  var max=Math.max.apply(null,all);
  max=Math.ceil(max/50)*50;
  if(!max)max=100;
  function x(i){return pl+i*(W-pl-pr)/(labels.length-1)}
  function y(v){return pt+(H-pt-pb)*(1-v/max)}
  var pathA=a.map(function(v,i){return (i?'L':'M')+x(i)+','+y(v)}).join(' ');
  var pathB=b?b.map(function(v,i){return (i?'L':'M')+x(i)+','+y(v)}).join(' '):'';
  var area='M'+x(0)+','+y(0)+' L'+a.map(function(v,i){return x(i)+','+y(v)}).join(' L')+' L'+x(a.length-1)+','+y(0)+' Z';
  var grid='',ticks=4;
  for(var g=0;g<=ticks;g++){
    var val=Math.round(max/ticks*g),gy=y(val);
    grid+='<line class="grid-line" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+gy+'" y2="'+gy+'"/>'+
      '<text class="axis-label" x="'+(pl-8)+'" y="'+(gy+3)+'" text-anchor="end">'+val+'</text>';
  }
  var xlabels='';
  labels.forEach(function(l,i){
    if(labels.length>8&&i%2!==0&&i!==labels.length-1)return;
    xlabels+='<text class="axis-label" x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(l)+'</text>';
  });
  var dotsA=a.map(function(v,i){return '<circle class="dot-blue" cx="'+x(i)+'" cy="'+y(v)+'" r="2.7"/>'}).join('');
  var dotsB=b?b.map(function(v,i){return '<circle class="dot-gold" cx="'+x(i)+'" cy="'+y(v)+'" r="2.4"/>'}).join(''):'';
  return '<div class="chart-shell"><svg class="line-chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Grafik tren '+esc(chartId||'kunjungan')+'">'+
    '<defs><linearGradient id="area'+(chartId||'A')+'" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0066FF" stop-opacity=".18"/><stop offset="1" stop-color="#0066FF" stop-opacity="0"/></linearGradient></defs>'+
    grid+'<path class="area-blue" d="'+area+'" fill="url(#area'+(chartId||'A')+')"/>'+
    '<path class="series-blue" d="'+pathA+'"/>'+(pathB?'<path class="series-gold" d="'+pathB+'"/>':'')+
    dotsA+dotsB+xlabels+'</svg></div>';
}

    '<div class="worklist mt-13"><div class="work-item"><span class="work-icon">'+icon('clock')+'</span><div class="work-copy"><b>Bahasa Indonesia</b><span>Web Speech API · pemrosesan browser</span></div></div><div class="work-item"><span class="work-icon green">'+icon('check')+'</span><div class="work-copy"><b>Human review wajib</b><span>Dokter memvalidasi sebelum simpan ke RM</span></div></div></div>';
  openModal('Dokumentasi klinis','Medical scribe','Rekam percakapan atau tulis transkrip, lalu simpan setelah review.',body,'<button class="btn" type="button" data-action="scribe-sample">Gunakan contoh</button><button class="btn" id="scribeRecordBtn" type="button" data-action="start-scribe">Mulai rekam</button><button class="btn btn-primary" type="button" data-action="save-scribe" data-id="'+p.id+'">Simpan ke RM</button>');
}
function startScribe(){
  if(scribeRecognition){
    scribeRecognition.stop();
    scribeRecognition=null;
    return;
  }
  var SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    var status=$('#scribeStatus');if(status)status.innerHTML='<span class="dot-warn"></span> Speech-to-text tidak didukung browser ini. Gunakan transkrip manual atau contoh.';
    toast('Speech-to-text tidak tersedia. Gunakan transkrip manual.','warning');
    return;
  }
  scribeFinalText=$('#scribeText').value||'';
  scribeRecognition=new SpeechRecognition();
  scribeRecognition.lang='id-ID';
  scribeRecognition.continuous=true;
  scribeRecognition.interimResults=true;
  var status=$('#scribeStatus'),button=$('#scribeRecordBtn');
  if(status)status.innerHTML='<span class="dot-live"></span> Merekam… bicara secara jelas.';
  if(button)button.textContent='Stop rekam';
  scribeRecognition.onresult=function(event){
    var interim='';
    for(var i=event.resultIndex;i<event.results.length;i++){
      if(event.results[i].isFinal)scribeFinalText+=event.results[i][0].transcript+' ';
      else interim+=event.results[i][0].transcript;
    }
    var textarea=$('#scribeText');if(textarea)textarea.value=(scribeFinalText+interim).trim();
  };
  scribeRecognition.onerror=function(){
    if(status)status.innerHTML='<span class="dot-warn"></span> Mikrofon tidak tersedia. Gunakan transkrip manual.';
    toast('Izin atau perangkat mikrofon tidak tersedia.','warning');
  };
  scribeRecognition.onend=function(){
    scribeRecognition=null;
    if(status)status.innerHTML='<span></span> Rekaman selesai · periksa transkrip';
    if(button)button.textContent='Mulai rekam';
  };
  try{scribeRecognition.start();}catch(e){scribeRecognition=null;toast('Perekaman tidak dapat dimulai.','warning');}
}
function saveScribe(pid){

  openPatient(pid);
}

function renderRoute(opts){
  opts=opts||{};
  var fn=ROUTES[state.route]||renderOverview;
  var y=opts.preserveScroll?window.scrollY:0;
  workspace.innerHTML=fn();
  renderNav();
  $('#breadcrumb').textContent=MODULE_LABEL[state.route]||'Overview';
  $$('.nav-item').forEach(function(a){a.classList.toggle('active',a.getAttribute('data-route')===state.route)});
  if(opts.preserveScroll)window.scrollTo(0,y);else window.scrollTo(0,0);
  afterRender(opts);
}
function afterRender(opts){
  $$('[data-action]',workspace).forEach(function(node){
    if(!/^(BUTTON|A|INPUT|SELECT|TEXTAREA)$/.test(node.tagName)&&!node.hasAttribute('tabindex')){
      node.tabIndex=0;
      node.setAttribute('role','button');
    }
  });
  var drop=$('#ocrDrop');
  if(drop){
    ['dragenter','dragover'].forEach(function(evt){
      drop.addEventListener(evt,function(e){e.preventDefault();drop.classList.add('dragover')});
    });
    ['dragleave','drop'].forEach(function(evt){
      drop.addEventListener(evt,function(e){e.preventDefault();drop.classList.remove('dragover')});
    });
    drop.addEventListener('drop',function(e){
      if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length)handleOcrFiles(e.dataTransfer.files);
    });
  }
  if(opts.focusId){
    var focusEl=document.getElementById(opts.focusId);
    if(focusEl){
      focusEl.focus();
      if(focusEl.setSelectionRange&&typeof opts.caret==='number'){
        try{focusEl.setSelectionRange(opts.caret,opts.caret)}catch(e){}
      }
    }
  }
}
function refreshRoute(focusId){
  var el=focusId?document.getElementById(focusId):null;
  var caret=el&&typeof el.selectionStart==='number'?el.selectionStart:null;
  renderRoute({preserveScroll:true,focusId:focusId,caret:caret});
}

  opts=opts||{};

  state.route=route;
  closeAllPanels();
  hideSearchResults();
  $('#sidebar').classList.remove('open');

  var p={

    rm:'06-22-'+String(Math.floor(1000+Math.random()*9000)),

    doctor:$('#npDoctor').value,

    dob:$('#npDob').value||'—',
    allergies:$('#npAllergy').value||'Tidak ada',
    lastVisit:'22 Okt 2026',
    room:'—'
  };
  allPatients.unshift(p);
  DATA.patients.unshift(p);
  if(p.type==='Rawat Jalan'){
    DATA.outpatient.unshift({id:id('RJ'),patientId:p.id,time:'Sekarang',doctor:p.doctor,clinic:p.unit,status:'Menunggu',complaint:'Registrasi pasien baru'});

  }else if(p.type==='MCU'){
    DATA.mcu.unshift({id:id('MCU'),patient:p.name,package:'Corporate Basic',date:'22 Okt 2026',status:'Menunggu',progress:10,doctor:p.doctor});
  }

function handleOcrFiles(files){
  if(!files||!files.length)return;
  Array.prototype.forEach.call(files,function(file){
    var ext=file.name.split('.').pop().toUpperCase();
    var job={
      id:id('OCR'),
      fileName:file.name,
      fileType:ext||'FILE',
      size:(file.size>1024*1024?(file.size/1024/1024).toFixed(1)+' MB':Math.max(1,Math.round(file.size/1024))+' KB'),
      status:'Memproses',
      confidence:0,
      progress:5,
      created:'22 Okt · sekarang',
      fields:{patientName:'Mendeteksi identitas…',rm:'—',visitDate:'22 Okt 2026',diagnosis:'Mendeteksi diagnosis…',icd10:'—',doctor:'—',total:'—'},
      text:'Memproses dokumen '+file.name+'. Field akan dicocokkan dengan master pasien setelah ekstraksi selesai.',
      previewUrl:file.type&&file.type.indexOf('image/')===0?URL.createObjectURL(file):''
    };
    DATA.ocrJobs.unshift(job);
    state.ocr.selected=job.id;
    if(file.type&&file.type.indexOf('image/')===0)recognizeImageOcr(job,file);
    else if(file.type==='application/pdf'||/\.pdf$/i.test(file.name))recognizePdfOcr(job,file);
    else if(file.type==='text/plain'||/\.txt$/i.test(file.name)){
      file.text().then(function(text){finishOcrJob(job,text,99,'Text layer')}).catch(function(){processDemoOcr(job)});
    }else processDemoOcr(job);
  });
  if(state.route==='ocr')renderRoute({preserveScroll:true});
  toast(files.length+' dokumen masuk antrean OCR.','success');
}
function processDemoOcr(job){
  var steps=[16,32,51,70,86,100],i=0;
  var timer=setInterval(function(){
    job.progress=steps[i];
    if(job.progress>=100){
      job.status='Selesai';
      job.confidence=94+Math.floor(Math.random()*5);
      job.engine='Demo extraction';
      job.fields={patientName:'Ny. Dewi Puspita',rm:'02-18-3412',visitDate:'22 Okt 2026',diagnosis:'Gagal jantung kongestif',icd10:'I50.9',doctor:'dr. Hendra Gunawan, Sp.JP',total:'12.480.000'};
      job.text='Resume medis rawat inap. Pasien Dewi Puspita, No. RM 02-18-3412. Diagnosis utama gagal jantung kongestif I50.9. Evidence lab mendukung evaluasi hiponatremia. Total tagihan Rp 12.480.000.';
      clearInterval(timer);
      logAction('Menyelesaikan OCR '+job.fileName,'OCR & dokumen');
      if(state.route==='ocr')renderRoute({preserveScroll:true});
      toast('OCR selesai · '+job.fileName,'success');
    }else if(state.route==='ocr'){
      renderRoute({preserveScroll:true});
    }
    i++;
  },360);
}
var ocrEnginePromise=null;
function loadOcrEngine(){
  if(window.Tesseract&&window.Tesseract.recognize)return Promise.resolve(window.Tesseract);
  if(ocrEnginePromise)return ocrEnginePromise;
  ocrEnginePromise=new Promise(function(resolve,reject){
    var script=document.createElement('script');
    script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    script.async=true;
    script.onload=function(){resolve(window.Tesseract)};
    script.onerror=function(){reject(new Error('OCR engine tidak tersedia'))};
    document.head.appendChild(script);
  });
  return ocrEnginePromise;
}
function fieldsFromOcrText(text){
  var out={};
  var m;
  m=text.match(/Nama\s*[:\-]\s*([^\n]+)/i);if(m)out.patientName=m[1].trim();
  m=text.match(/No\.?\s*RM\s*[:\-]\s*([^\n]+)/i);if(m)out.rm=m[1].trim().slice(0,30);
  m=text.match(/Tanggal\s*[:\-]\s*([^\n]+)/i);if(m)out.visitDate=m[1].trim().slice(0,30);
  m=text.match(/Diagnosis\s*[:\-]\s*([^\n]+)/i);if(m)out.diagnosis=m[1].trim().slice(0,80);
  m=text.match(/\b([A-Z]\d{2}(?:\.\d{1,2})?)\b/);if(m)out.icd10=m[1];
  m=text.match(/(?:DPJP|Dokter)\s*[:\-]\s*([^\n]+)/i);if(m)out.doctor=m[1].trim().slice(0,70);
  m=text.match(/Rp\.?\s*([\d.,]+)/i);if(m)out.total=m[1].trim();
  return out;
}
function finishOcrJob(job,text,confidence,engine){
  var parsed=fieldsFromOcrText(text||'');
  Object.keys(parsed).forEach(function(k){job.fields[k]=parsed[k]});
  if(!parsed.patientName)job.fields.patientName='Perlu verifikasi identitas';
  if(!parsed.rm)job.fields.rm='—';
  if(!parsed.diagnosis)job.fields.diagnosis='Perlu verifikasi diagnosis';
  if(!parsed.icd10)job.fields.icd10='—';
  if(!parsed.doctor)job.fields.doctor='—';
  if(!parsed.total)job.fields.total='—';
  job.text=text||job.text;
  job.confidence=Math.max(0,Math.min(100,Math.round(confidence||88)));
  job.progress=100;
  job.engine=engine||job.engine||'Browser OCR';
  job.status=(job.confidence<80||!parsed.rm)?'Perlu koreksi':'Selesai';
  logAction('Menyelesaikan OCR '+job.fileName,'OCR & dokumen');
  if(state.route==='ocr')renderRoute({preserveScroll:true});
  toast('Dokumen '+job.fileName+' selesai diproses.','success');
}
function recognizeImageOcr(job,file){
  loadOcrEngine().then(function(Tesseract){
    job.engine='Browser OCR';
    return Tesseract.recognize(file,'ind+eng',{logger:function(m){
      if(m.status==='recognizing text'){
        job.progress=Math.max(10,Math.min(96,Math.round(10+(m.progress||0)*86)));
        if(state.route==='ocr'&&job.progress%18===0)renderRoute({preserveScroll:true});
      }
    }});
  }).then(function(result){
    var text=result&&result.data&&result.data.text?result.data.text:'';
    var confidence=result&&result.data&&result.data.confidence?result.data.confidence:88;
    finishOcrJob(job,text,confidence,'Browser OCR');
  }).catch(function(){
    job.engine='Demo extraction';
    processDemoOcr(job);
  });
}
var pdfEnginePromise=null;
function loadPdfEngine(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  if(pdfEnginePromise)return pdfEnginePromise;
  pdfEnginePromise=new Promise(function(resolve,reject){
    var script=document.createElement('script');
    script.src='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
    script.async=true;
    script.onload=function(){
      if(!window.pdfjsLib){reject(new Error('pdf.js tidak tersedia'));return;}
      window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
      resolve(window.pdfjsLib);
    };
    script.onerror=function(){reject(new Error('pdf.js tidak tersedia'))};
    document.head.appendChild(script);
  });
  return pdfEnginePromise;
}
async function recognizePdfOcr(job,file){
  try{
    job.engine='PDF extraction';
    var pdfjs=await loadPdfEngine();
    var data=await file.arrayBuffer();
    var pdf=await pdfjs.getDocument({data:data}).promise;
    var textParts=[];
    var tesseract=null;
    var limit=Math.min(4,pdf.numPages);
    for(var pageNo=1;pageNo<=limit;pageNo++){
      job.progress=Math.min(92,10+Math.round(pageNo/limit*65));
      if(state.route==='ocr')renderRoute({preserveScroll:true});
      var page=await pdf.getPage(pageNo);
      var content=await page.getTextContent();
      var pageText=content.items.map(function(item){return item.str;}).join(' ').trim();
      if(pageText.length>40){textParts.push(pageText);continue;}
      tesseract=tesseract||await loadOcrEngine();
      var viewport=page.getViewport({scale:2});
      var canvas=document.createElement('canvas');
      canvas.width=viewport.width;canvas.height=viewport.height;
      await page.render({canvasContext:canvas.getContext('2d'),viewport:viewport}).promise;
      var scan=await tesseract.recognize(canvas,'ind+eng',{logger:function(m){
        if(m.status==='recognizing text')job.progress=Math.min(96,Math.round(10+(m.progress||0)*82));
      }});
      if(scan&&scan.data&&scan.data.text)textParts.push(scan.data.text);
    }
    var fullText=textParts.join('\n').trim();
    if(fullText.length>=20){
      finishOcrJob(job,fullText,tesseract?88:96,tesseract?'PDF + Browser OCR':'PDF text layer');
    }else{
      throw new Error('Tidak ada teks pada PDF');
    }
  }catch(e){
    job.engine='Demo extraction';
    processDemoOcr(job);
  }
}

function handleWorkspaceClick(e){
  var routeBtn=e.target.closest('[data-route]');
  if(routeBtn){
    e.preventDefault();
    navigate(routeBtn.getAttribute('data-route'));
    return;
  }
  var actionEl=e.target.closest('[data-action]');
  if(!actionEl)return;
  var action=actionEl.getAttribute('data-action');
  var elId=actionEl.getAttribute('data-id');
  var row=actionEl.closest('tr');
  if(!elId&&row&&row.getAttribute('data-id'))elId=row.getAttribute('data-id');
  if(action!=='close-drawer'&&action!=='close-modal')e.stopPropagation();
  switch(action){
    case 'new-patient':openNewPatient(actionEl.getAttribute('data-type'));break;
    case 'open-patient':openPatient(elId);break;
    case 'open-scribe':openScribe(elId);break;
    case 'start-scribe':startScribe();break;
    case 'scribe-sample':var st=$('#scribeText');if(st)st.value='Dokter: Keluhan sesak memberat sejak dua hari, disertai bengkak pada kedua kaki. Pasien riwayat gagal jantung. Pemeriksaan: TD 148/92, HR 104, SpO2 94% room air, ronki basah kedua basal paru. Rencana: foto toraks, elektrolit, BNP, dan evaluasi cairan. Edukasi pembatasan garam diberikan.';var ss=$('#scribeStatus');if(ss)ss.innerHTML='<span></span> Contoh transkrip dimuat · perlu review dokter';break;
    case 'save-scribe':saveScribe(elId);break;
    case 'open-bed':openBed(elId);break;
    case 'open-emergency':openEmergency(elId);break;
    case 'open-surgery':openSurgery(elId);break;
    case 'open-rx':openRx(elId);break;
    case 'open-lab':openLab(elId);break;
    case 'open-rad':openRad(elId);break;
    case 'open-diet':openDiet(elId);break;
    case 'open-mcu':openMCU(elId);break;
    case 'open-invoice':openInvoice(elId);break;
    case 'open-claim':openClaim(elId);break;
    case 'open-auth':openAuth(elId);break;
    case 'open-staff':openStaff(elId);break;
    case 'open-inventory':openInventory(elId);break;
    case 'open-ocr-job':state.ocr.selected=elId;renderRoute({preserveScroll:true});break;
