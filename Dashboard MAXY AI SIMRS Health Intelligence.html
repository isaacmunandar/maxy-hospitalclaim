function advanceOutpatient(idValue){
  var q=DATA.outpatient.filter(function(x){return x.id===idValue})[0];
  if(!q)return;
  var next={Menunggu:'Dipanggil',Dipanggil:'Konsultasi',Konsultasi:'Selesai'}[q.status];
  if(next){
    q.status=next;
    var p=patientById(q.patientId);
    if(p)p.status=next==='Selesai'?'Selesai':next;
    logAction('Mengubah status antrean '+q.id+' menjadi '+next,'Rawat jalan');
    refreshNavCounts();renderRoute({preserveScroll:true});toast('Antrean '+q.id+' → '+next,'success');
  }
}
function setBedStatus(bedId,status){
  var b=DATA.beds.filter(function(x){return x.id===bedId})[0];
  if(!b)return;
  var patient=b.patient?allPatients.find(function(p){return p.name===b.patient}):null;
  b.status=status;
  if(status==='kosong'||status==='bersih'){
    if(patient){patient.room='—';patient.status='Pulang';}
    b.patient='';b.dx='';b.doctor='';
  }
  logAction('Mengubah status bed '+bedId+' menjadi '+status,'Rawat inap');
  closeDrawer();renderRoute({preserveScroll:true});toast('Bed '+bedId+' → '+status,'success');
}
function openAssignBed(bedId){
  var body='<div class="form-grid"><div class="form-row full"><label>Pasien</label><select class="form-field" id="assignPatient">'+patientOptions()+'</select></div><div class="form-row full"><label>Diagnosis</label><input class="form-field" id="assignDx" placeholder="Diagnosis kerja"></div></div>';
  openModal('Bed board','Assign pasien','Tempatkan pasien ke bed '+esc(bedId)+'.',body,'<button class="btn" type="button" data-action="close-modal">Batal</button><button class="btn btn-primary" type="button" data-action="confirm-assign-bed" data-id="'+bedId+'">Assign</button>');
}
function assignBed(bedId){
  var pid=$('#assignPatient').value;
  if(!pid){toast('Pilih pasien terlebih dahulu.','warning');return;}
  var p=patientById(pid),b=DATA.beds.filter(function(x){return x.id===bedId})[0];
  if(!p||!b)return;
  b.status='terisi';b.patient=p.name;b.dx=$('#assignDx').value||p.unit;b.doctor=p.doctor;p.room=bedId;p.status='Dirawat';p.type='Rawat Inap';
  logAction('Mengassign '+p.name+' ke bed '+bedId,'Rawat inap');
  closeModal();closeDrawer();renderRoute({preserveScroll:true});toast('Pasien ditempatkan di '+bedId,'success');
}
function advanceEmergency(emId){
  var e=DATA.emergency.filter(function(x){return x.id===emId})[0];
  if(!e)return;
  if(e.status==='Menunggu')e.status='Triage';
  else if(e.status==='Triage')e.status='Pemeriksaan';
  else if(e.status==='Pemeriksaan'||e.status==='Resusitasi')e.status='Selesai';
  var p=allPatients.find(function(x){return x.name===e.patient});
  if(p)p.status=e.status==='Selesai'?'Selesai':'Dalam triage';
  logAction('Mengubah status IGD '+e.id+' menjadi '+e.status,'IGD');
  closeDrawer();refreshNavCounts();renderRoute({preserveScroll:true});toast('IGD '+e.id+' → '+e.status,'success');
}
function advanceSurgery(idValue){
  var s=DATA.surgeries.filter(function(x){return x.id===idValue})[0];
  if(!s)return;
  var next={Terjadwal:'Persiapan',Persiapan:'Berlangsung',Berlangsung:'Selesai'}[s.status];
  if(next){s.status=next;logAction('Mengubah status operasi '+s.id+' menjadi '+next,'Operasi');}
  closeDrawer();renderRoute({preserveScroll:true});toast(next?'Status operasi → '+next:'Operasi sudah selesai.','success');
}
function advanceRx(idValue){
  var r=DATA.prescriptions.filter(function(x){return x.id===idValue})[0];
  if(!r)return;
  var next={Antrean:'Disiapkan',Disiapkan:'Siap',Siap:'Diserahkan'}[r.status];
  if(next){r.status=next;logAction('Mengubah status resep '+r.id+' menjadi '+next,'Farmasi');}
  closeDrawer();renderRoute({preserveScroll:true});toast('Resep '+r.id+' → '+(next||r.status),'success');
}
function advanceLab(idValue){
  var l=DATA.labs.filter(function(x){return x.id===idValue})[0];
  if(!l)return;
  var stages=['Order','Sampling','Analisis','Validasi','Selesai'],idx=stages.indexOf(l.status);
  if(idx<stages.length-1){l.status=stages[idx+1];logAction('Mengubah status lab '+l.id+' menjadi '+l.status,'Laboratorium');}
  closeDrawer();renderRoute({preserveScroll:true});toast('Order lab '+l.id+' → '+l.status,'success');
}
function advanceRad(idValue){
  var r=DATA.radiology.filter(function(x){return x.id===idValue})[0];
  if(!r)return;
  var stages=['Order','Akuisisi','Dibaca','Ekspertise','Selesai'],idx=stages.indexOf(r.status);
  if(idx<stages.length-1){r.status=stages[idx+1];logAction('Mengubah status radiologi '+r.id+' menjadi '+r.status,'Radiologi');}
  closeDrawer();renderRoute({preserveScroll:true});toast('Order radiologi '+r.id+' → '+r.status,'success');
}
function saveRadReport(idValue){
  var r=DATA.radiology.filter(function(x){return x.id===idValue})[0];
  if(!r)return;
  var el=$('#radReport');
  if(el)r.report=el.value.trim();
  logAction('Menyimpan laporan radiologi '+idValue,'Radiologi');
  toast('Laporan radiologi tersimpan.','success');
}
function advanceDiet(idValue){
  var n=DATA.nutrition.filter(function(x){return x.id===idValue})[0];
  if(!n)return;
  var next={Draft:'Diproses',Diproses:'Terkirim',Konsultasi:'Diproses',Terkirim:null}[n.status];
  if(next){n.status=next;logAction('Mengubah status diet '+n.id+' menjadi '+next,'Gizi');}
  closeDrawer();renderRoute({preserveScroll:true});toast(next?'Diet '+n.id+' → '+next:'Order diet sudah terkirim.','success');
}
function advanceMcu(idValue){
  var m=DATA.mcu.filter(function(x){return x.id===idValue})[0];
  if(!m)return;
  m.progress=Math.min(100,m.progress+20);
  m.status=m.progress>=100?'Selesai':m.progress>=80?'Validasi hasil':'Dalam pemeriksaan';
  logAction('Memajukan progres MCU '+m.id+' menjadi '+m.progress+'%','MCU');
  closeDrawer();renderRoute({preserveScroll:true});toast('Progres MCU '+m.progress+'%.','success');
}
function markInvoicePaid(invId){
  var i=DATA.invoices.filter(function(x){return x.id===invId})[0];
  if(!i)return;
  i.status='Lunas';
  logAction('Mencatat pembayaran invoice '+i.id,'Billing & kasir');
  closeDrawer();renderRoute({preserveScroll:true});toast('Pembayaran '+i.id+' tercatat lunas.','success');
}
function runClaimVerifier(){
  var pending=DATA.claims.filter(function(c){return c.status==='Belum diperiksa'});
  pending.forEach(function(c){c.status=c.risk>=55?'Perlu perbaikan':'Siap diajukan';});
  if(pending.length){logAction('Menjalankan claim verifier untuk '+pending.length+' berkas','Klaim BPJS');}
  refreshNavCounts();renderRoute({preserveScroll:true});toast(pending.length?pending.length+' klaim selesai diverifikasi.':'Tidak ada klaim baru untuk diverifikasi.',pending.length?'success':'warning');
}
function approveClaim(claimId){
  var c=DATA.claims.filter(function(x){return x.id===claimId})[0];
  if(!c)return;
  c.status='Siap diajukan';c.risk=Math.min(c.risk,28);
  logAction('Menandai klaim '+c.id+' siap diajukan','Klaim BPJS');
  closeDrawer();refreshNavCounts();renderRoute({preserveScroll:true});toast('Klaim '+c.id+' siap diajukan.','success');
}
function acceptClaimSuggestion(claimId){
  var c=DATA.claims.filter(function(x){return x.id===claimId})[0];
  if(!c)return;
  c.tariff+=c.potential||0;
  c.potential=0;c.suggest=null;c.suggestName='';c.status='Siap diajukan';c.risk=Math.min(c.risk,24);
  logAction('Menerima saran koding pada '+c.id,'Klaim BPJS');
  closeDrawer();refreshNavCounts();renderRoute({preserveScroll:true});toast('Saran diterima · tarif klaim diperbarui.','success');
}
function dismissClaimSuggestion(claimId){
  var c=DATA.claims.filter(function(x){return x.id===claimId})[0];
  if(!c)return;
  c.suggest=null;c.suggestName='';c.potential=0;
  logAction('Mengabaikan saran koding pada '+c.id,'Klaim BPJS');
  closeDrawer();renderRoute({preserveScroll:true});toast('Saran koding diabaikan.','warning');
}
function advanceAuth(authId){
  var a=DATA.insuranceAuth.filter(function(x){return x.id===authId})[0];
  if(!a)return;
  var next={Menunggu:'Perlu dokumen',Pending:'Perlu dokumen','Perlu dokumen':'Disetujui'}[a.status];
  if(!next&&a.status!=='Disetujui')next='Disetujui';
  a.status=next||a.status;
  logAction('Mengubah status otorisasi '+a.id+' menjadi '+a.status,'Asuransi & TPA');
  closeDrawer();renderRoute({preserveScroll:true});toast('Otorisasi '+a.id+' → '+a.status,'success');
}
function adjustStock(invId,mode){
  var i=DATA.inventory.filter(function(x){return x.id===invId})[0];
  if(!i)return;
  var amount=Math.max(1,Number($('#stockAmount')&&$('#stockAmount').value||1));
  i.stock=mode==='in'?i.stock+amount:Math.max(0,i.stock-amount);
  i.status=i.stock===0?'Kritis':i.stock<i.min?'Menipis':'Aman';
  logAction((mode==='in'?'Menambah':'Mengurangi')+' stok '+i.name+' sebanyak '+amount+' '+i.unit,'Inventori');
  closeDrawer();renderRoute({preserveScroll:true});toast('Stok '+i.name+' diperbarui menjadi '+i.stock+' '+i.unit,'success');
}
function confirmPayroll(){
  var body='<div class="processing" style="height:9px"><span id="payrollBar" style="width:4%"></span></div><p class="form-help" id="payrollStatus">Menyiapkan batch payroll…</p>';
  openModal('SDM & payroll','Payroll berjalan','Jangan tutup jendela ini.',body,'');
  var pct=4;
  var timer=setInterval(function(){
    pct=Math.min(100,pct+Math.floor(12+Math.random()*18));
    var bar=$('#payrollBar'),status=$('#payrollStatus');
    if(bar)bar.style.width=pct+'%';
    if(status){
      status.textContent=pct<40?'Memvalidasi absensi dan komponen gaji…':pct<75?'Menghitung potongan dan pajak…':'Menyiapkan batch pembayaran…';
    }
    if(pct>=100){
      clearInterval(timer);
      logAction('Menjalankan payroll 284 staf','SDM & payroll');
      closeModal();toast('Payroll 284 staf berhasil dijalankan.','success');
    }
  },320);
}
function syncIntegration(intId){
  if(intId==='all'){
    syncAll();return;
  }
  var i=DATA.integrations.filter(function(x){return x.id===intId})[0];
  if(!i)return;
  i.last='Baru saja';
  i.status=i.enabled?'Terhubung':'Perlu konfigurasi';
  logAction('Sinkronisasi '+i.name+' selesai','Integrasi');
  closeDrawer();closeModal();renderRoute({preserveScroll:true});toast(i.name+' berhasil disinkronkan.','success');
}
function syncAll(){
  DATA.integrations.forEach(function(i){if(i.enabled){i.last='Baru saja';i.status='Terhubung';}});
  logAction('Sinkronisasi semua integrasi','Integrasi');
  renderRoute({preserveScroll:true});toast('Semua integrasi aktif telah disinkronkan.','success');
}
function startEncounter(pid){
  var p=patientById(pid);
  if(!p)return;
  closeDrawer();
  var route=p.type==='Rawat Inap'?'inpatient':p.type==='IGD'?'emergency':'outpatient';
  navigate(route);
  toast('Kunjungan '+p.name+' dibuka di '+MODULE_LABEL[route]+'.','success');
}
function createInvoiceForPatient(pid){

function toggleChartTab(btn){
  var group=btn.parentNode;
  $$('.chart-tab',group).forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  toast('Tampilan '+btn.textContent.trim()+' dipilih (demo).','success');
}

function hideSearchResults(){
  var res=$('#searchResults');
  if(res)res.hidden=true;
}
function renderSearchResults(query){
  var res=$('#searchResults'),q=String(query||'').trim().toLowerCase();
  if(!q){hideSearchResults();return;}
  var items=[];
  MODULES.forEach(function(m){if([m.label,m.desc].join(' ').toLowerCase().indexOf(q)>=0)items.push({kind:'Modul',label:m.label,sub:m.desc,icon:m.icon,route:m.id})});
  allPatients.forEach(function(p){if([p.name,p.rm,p.id,p.doctor].join(' ').toLowerCase().indexOf(q)>=0)items.push({kind:'Pasien',label:p.name,sub:p.rm+' · '+p.unit,icon:'patients',patient:p.id})});
  DATA.claims.forEach(function(c){if([c.id,c.sep,c.patient,c.diagnosis].join(' ').toLowerCase().indexOf(q)>=0)items.push({kind:'Klaim',label:c.patient,sub:c.id+' · '+c.diagnosis,icon:'claims',claim:c.id})});
  items=items.slice(0,9);
  if(!items.length){res.innerHTML='<div class="search-empty">Tidak ada hasil untuk “'+esc(query)+'”.</div>';res.hidden=false;return;}
  res.innerHTML=items.map(function(i){return '<button class="search-result" type="button" data-search-kind="'+i.kind+'"'+(i.route?' data-route="'+i.route+'"':'')+(i.patient?' data-action="open-patient" data-id="'+i.patient+'"':'')+(i.claim?' data-action="open-claim" data-id="'+i.claim+'"':'')+'><span class="result-ico">'+icon(i.icon)+'</span><span><b>'+esc(i.label)+'</b><span>'+esc(i.sub)+'</span></span><span class="result-kind">'+i.kind+'</span></button>'}).join('');
  res.hidden=false;
}

var filterTimer=null;
function updateFilter(key,value){
  if(key==='patient-q')state.patients.q=value;
  else if(key==='patient-type')state.patients.type=value;
  else if(key==='patient-status')state.patients.status=value;
  else if(key==='outpatient-doctor')state.outpatient.doctor=value;
  else if(key==='ward')state.inpatient.ward=value;
  else if(key==='claim-q')state.claims.q=value;
  else if(key==='claim-type')state.claims.type=value;
  else if(key==='claim-status')state.claims.status=value;
  else if(key==='invoice-q')state.invoices.q=value;
  else if(key==='invoice-status')state.invoices.status=value;
  else if(key==='inventory-q')state.inventory.q=value;
  else if(key==='inventory-filter')state.inventory.filter=value;
  else if(key==='audit-q')state.audit.q=value;
  else if(key==='period')state.period=value;
}
function handleWorkspaceInput(e){
  var ocrInput=e.target.closest('[data-ocr-field]');
  if(ocrInput){
    var job=DATA.ocrJobs.filter(function(j){return j.id===state.ocr.selected})[0];
    if(job)job.fields[ocrInput.getAttribute('data-ocr-field')]=ocrInput.value;
    return;
  }
  var filter=e.target.getAttribute('data-filter');
  if(!filter)return;
  updateFilter(filter,e.target.value);
  var focusId=e.target.id;
  clearTimeout(filterTimer);
  filterTimer=setTimeout(function(){refreshRoute(focusId)},140);
}
function handleWorkspaceChange(e){
  if(e.target.id==='ocrFile'){
    handleOcrFiles(e.target.files);
    e.target.value='';
    return;
  }
  var toggle=e.target.getAttribute('data-integration-toggle');
  if(toggle){
    var integration=DATA.integrations.filter(function(i){return i.id===toggle})[0];
    if(integration){
      integration.enabled=e.target.checked;
      integration.status=e.target.checked?'Terhubung':'Nonaktif';
      integration.last=e.target.checked?'Baru saja':'—';
      logAction((e.target.checked?'Mengaktifkan':'Menonaktifkan')+' integrasi '+integration.name,'Integrasi');
      renderRoute({preserveScroll:true});
      toast(integration.name+(e.target.checked?' diaktifkan.':' dinonaktifkan.'),e.target.checked?'success':'warning');
    }
    return;
  }
  var filter=e.target.getAttribute('data-filter');
  if(filter){
    updateFilter(filter,e.target.value);
    renderRoute({preserveScroll:true});
  }
}
function bindGlobalEvents(){
  document.addEventListener('click',handleWorkspaceClick);
  workspace.addEventListener('input',handleWorkspaceInput);
  workspace.addEventListener('change',handleWorkspaceChange);
  workspace.addEventListener('keydown',function(e){
    if(e.key!=='Enter'&&e.key!==' ')return;
    var target=e.target.closest('[data-action],[data-route]');
    if(!target||/^(BUTTON|A|INPUT|SELECT|TEXTAREA)$/.test(target.tagName))return;
    e.preventDefault();
    target.click();
  });
  overlay.addEventListener('click',function(){
    $('#sidebar').classList.remove('open');
    $('#mobileMenu').setAttribute('aria-expanded','false');
    closeAllPanels();
  });
  modalRoot.addEventListener('click',function(e){if(e.target===modalRoot)closeModal()});
  $('#mobileMenu').addEventListener('click',function(){
    var open=$('#sidebar').classList.toggle('open');
    this.setAttribute('aria-expanded',open?'true':'false');
    overlay.classList.toggle('on',open);
  });
  $('#sidebarClose').addEventListener('click',function(){
    $('#sidebar').classList.remove('open');
    overlay.classList.remove('on');
    $('#mobileMenu').setAttribute('aria-expanded','false');
  });
  $('#facilitySwitcher').addEventListener('click',openFacilities);
  $('#userMenuBtn').addEventListener('click',openUserMenu);
  $('#notificationBtn').addEventListener('click',openNotifications);
  $('#newPatientBtn').addEventListener('click',function(){openNewPatient('Rawat Jalan')});
  $('#roleSelect').addEventListener('change',function(){
    state.role=this.value;
    var roleLabel=$('.user-copy small');
    if(roleLabel)roleLabel.textContent=state.role;
    logAction('Mengganti role aktif menjadi '+state.role,'Akses');
    toast('Role aktif: '+state.role,'success');
  });
  var search=$('#globalSearch');
  search.addEventListener('input',function(){renderSearchResults(this.value)});
  search.addEventListener('focus',function(){if(this.value)renderSearchResults(this.value)});
  search.addEventListener('keydown',function(e){
    if(e.key==='Escape'){hideSearchResults();this.blur();return;}
    if(e.key==='Enter'){
      var first=$('#searchResults .search-result');
      if(first){e.preventDefault();first.click();}
    }
  });
  document.addEventListener('keydown',function(e){
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){
      e.preventDefault();
      search.focus();
      search.select();
      if(search.value)renderSearchResults(search.value);
    }
    if(e.key==='Escape'){
      if(modalRoot.classList.contains('on'))closeModal();
      else if(drawer.classList.contains('on'))closeDrawer();
      else hideSearchResults();
    }
  });
  document.addEventListener('click',function(e){
    if(!e.target.closest('#globalSearchWrap'))hideSearchResults();
  });
  function syncFromHash(){
    var route=(location.hash||'').replace('#','');
    if(!ROUTES[route])route='overview';
    if(route!==state.route){
      state.route=route;
      renderRoute();
    }
  }
  window.addEventListener('popstate',syncFromHash);
  window.addEventListener('hashchange',syncFromHash);
}

function boot(){
  renderNav();
  var start=(location.hash||'').replace('#','');
  if(!ROUTES[start])start='overview';
  state.route=start;
  bindGlobalEvents();
  renderRoute();
}

boot();

})();
